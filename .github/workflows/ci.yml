# Copyright © Erickson Lopez. MIT License.
name: Continuous Integration

on:
  push:
    branches: [ main, canonical ]
  pull_request:
    branches: [ main, canonical ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test (Multi-Targeting net8.0 / net9.0 / net10.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Java (for SonarScanner)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore EricksonLopez.Printing.slnx

      - name: Verify Code Formatting
        run: dotnet format EricksonLopez.Printing.slnx --verify-no-changes --verbosity diagnostic

      - name: Begin Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: env.SONAR_TOKEN != ''
        run: |
          dotnet sonarscanner begin /k:"ericksonlopezf_dotnet-printing" \
            /o:"ericksonlopezf" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml,TestResults/**/coverage.opencover.xml" \
            /d:sonar.exclusions="docs/**,samples/**,benchmarks/**,scripts/**,**/bin/**,**/obj/**,**/*.js,**/.github/**" \
            /d:sonar.coverage.exclusions="tests/**,samples/**,benchmarks/**,docs/**,**/*Tests.cs,**/*Test*.cs,**/bin/**,**/obj/**" \
            /d:sonar.cpd.exclusions="tests/**,**/tests/**,**/*Tests.cs,**/*Test*.cs,**/samples/**,**/benchmarks/**,**/bin/**,**/obj/**,**/*MonochromeBitmapConverter.cs"

      - name: Build Solution (Release)
        run: dotnet build EricksonLopez.Printing.slnx --configuration Release --no-restore

      - name: Run Test Suites with Coverage
        run: >
          dotnet test EricksonLopez.Printing.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover,cobertura

      - name: End Sonar Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: always() && env.SONAR_TOKEN != ''
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "./TestResults/**/coverage.cobertura.xml"
          fail_ci_if_error: false
          flags: unittests
          name: codecov-printing

      - name: Verify NuGet Packaging
        run: dotnet pack EricksonLopez.Printing.slnx --configuration Release --no-build --output ./artifacts-pack
